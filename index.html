<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PC Rádio FM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111111, #252525);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .radio-box {
            width: 100%;
            max-width: 600px;
            background: #181818;
            border-radius: 22px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .player {
            width: 100%;
            min-height: 100px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status {
            margin-top: 25px;
            color: #bbbbbb;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #888888;
        }
    </style>
</head>

<body>

    <main class="radio-box">

        <!--
        Se você já tiver uma imagem da logo no GitHub,
        depois podemos colocar o nome correto do arquivo aqui.
        Por enquanto a página funciona mesmo sem ela.
        -->

        <h1>PC Rádio FM</h1>

        <p class="subtitle">
            Música, informação e muito mais!
        </p>

        <div class="player">

            <div
                data-type="newStreamPlayer"
                data-publicToken="e9c78308-9d30-4c94-8bd6-185e3fa14f1f"
                data-theme="light"
                data-color="e81e4d"
                data-channelId="a2cda98a-3830-4240-8a16-a474017567bd"
                data-rendered="false"
                class="cstrEmbed">

                <a href="https://www.caster.fm">Shoutcast Hosting</a>
                <a href="https://www.caster.fm">Stream Hosting</a>
                <a href="https://www.caster.fm">Radio Server Hosting</a>

            </div>

        </div>

        <div class="status">
            🔴 PC Rádio FM — ao vivo
        </div>

        <div class="footer">
            Obrigado por ouvir a PC Rádio FM ❤️
        </div>

    </main>

    <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

</body>
</html>
