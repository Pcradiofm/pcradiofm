
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC Rádio FM - Música, Informação e Muito Mais!</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #4a1024 0%, #180611 38%, #050505 80%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.radio-box {
    width: 100%;
    max-width: 680px;
    background: rgba(13, 13, 16, 0.98);
    border: 1px solid rgba(232, 30, 77, 0.55);
    border-radius: 28px;
    padding: 25px 20px 22px;
    text-align: center;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.8),
        0 0 35px rgba(232,30,77,0.12);
}

/* LOGO MAIOR */
.logo {
    width: 145px;
    height: 145px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #e81e4d;
    display: block;
    margin: 0 auto 14px;
    box-shadow:
        0 0 0 6px rgba(232,30,77,0.08),
        0 0 28px rgba(232,30,77,0.4);
}

/* AO VIVO */
.live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #e81e4d;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 15px;
    border-radius: 25px;
    margin-bottom: 10px;
}

/* NOME */
h1 {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 4px;
}

h1 span {
    color: #e81e4d;
}

.subtitle {
    color: #aaa;
    font-size: 15px;
    margin-bottom: 17px;
}

/* TÍTULO DO PLAYER */
.player-title {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

/* PLAYER */
.player-box {
    background: white;
    border-radius: 17px;
    padding: 12px 10px;
    min-height: 105px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.cstrEmbed {
    width: 100%;
}

/* TOCANDO AGORA */
.now-playing {
    margin-top: 15px;
    background: #17171b;
    border: 1px solid #29292e;
    border-radius: 14px;
    padding: 12px;
}

.now-title {
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
}

.now-name {
    font-size: 16px;
    font-weight: bold;
}

.now-name span {
    color: #e81e4d;
}

.description {
    margin-top: 13px;
    color: #999;
    font-size: 13px;
}

.line {
    width: 65px;
    height: 3px;
    background: #e81e4d;
    margin: 18px auto 12px;
    border-radius: 10px;
}

.footer {
    color: #666;
    font-size: 12px;
    line-height: 1.5;
}

.footer strong {
    color: #999;
}

/* CELULAR */
@media (max-width: 480px) {

    body {
        padding: 8px;
    }

    .radio-box {
        padding: 20px 12px 18px;
        border-radius: 22px;
    }

    .logo {
        width: 125px;
        height: 125px;
        margin-bottom: 12px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 14px;
        margin-bottom: 14px;
    }

    .player-box {
        padding: 8px 5px;
    }

    .now-playing {
        margin-top: 12px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<main class="radio-box">

    <!-- LOGO -->
    <img
        src="f7c397f4-6ba6-4932-b2c7-2b6a61c99599.jpg"
        alt="PC Rádio FM"
        class="logo"
    >

    <!-- AO VIVO -->
    <div class="live">
        🔴 AO VIVO
    </div>

    <!-- NOME DA RÁDIO -->
    <h1>
        PC Rádio <span>FM</span>
    </h1>

    <p class="subtitle">
        Música, Informação e Muito Mais!
    </p>

    <!-- PLAYER -->
    <div class="player-title">
        🎧 OUÇA AGORA
    </div>

    <div class="player-box">

        <!-- CASTER.FM - MANTIDO ORIGINAL -->
        <div
            data-type="newStreamPlayer"
            data-publicToken="e9c78308-9d30-4c94-8bd6-185e3fa14f1f"
            data-theme="light"
            data-color="e81e4d"
            data-channelId="a2cda98a-3830-4240-8a16-a474017567bd"
