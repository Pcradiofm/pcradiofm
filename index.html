<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC Rádio FM - Música, Informação e Muito Mais!</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #080808, #250713, #080808);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
}

.radio-box {
    width: 100%;
    max-width: 650px;
    background: rgba(20, 20, 20, 0.97);
    border: 1px solid #e81e4d;
    border-radius: 25px;
    padding: 28px 20px 25px;
    text-align: center;
    box-shadow: 0 12px 45px rgba(0, 0, 0, 0.65);
}

/* LOGO */
.logo {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #e81e4d;
    margin: 0 auto 16px;
    display: block;
    box-shadow: 0 0 25px rgba(232, 30, 77, 0.45);
}

.live {
    display: inline-block;
    background: #e81e4d;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 17px;
    border-radius: 30px;
    margin-bottom: 13px;
}

h1 {
    font-size: 40px;
    margin-bottom: 6px;
    letter-spacing: 1px;
}

h1 span {
    color: #e81e4d;
}

.subtitle {
    color: #d0d0d0;
    font-size: 16px;
    margin-bottom: 20px;
}

/* PLAYER DO CASTER.FM */
.player-box {
    background: white;
    border-radius: 18px;
    padding: 18px;
    min-height: 110px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.cstrEmbed {
    width: 100% !important;
    min-height: 70px;
}

/* NÃO ALTERAR OS DADOS DO PLAYER */

.now-playing {
    margin-top: 20px;
    font-size: 17px;
    font-weight: bold;
}

.now-playing span {
    color: #e81e4d;
}

.description {
    margin-top: 8px;
    color: #aaa;
    font-size: 14px;
}

.line {
    width: 70px;
    height: 3px;
    background: #e81e4d;
    margin: 20px auto 15px;
    border-radius: 5px;
}

.footer {
    color: #888;
    font-size: 13px;
    line-height: 1.6;
}

@media (max-width: 480px) {

    body {
        padding: 10px;
        align-items: flex-start;
    }

    .radio-box {
        margin-top: 10px;
        padding: 23px 12px 20px;
    }

    .logo {
        width: 115px;
        height: 115px;
    }

    h1 {
        font-size: 33px;
    }

    .subtitle {
        font-size: 15px;
        margin-bottom: 17px;
    }

    .player-box {
        padding: 12px;
    }
}
</style>
</head>

<body>

<main class="radio-box">

    <img
        src="f7c397f4-6ba6-4932-b2c7-2b6a61c99599.jpg"
        alt="PC Rádio FM"
        class="logo"
    >

    <div class="live">
        🔴 AO VIVO
    </div>

    <h1>
        PC Rádio <span>FM</span>
    </h1>

    <p class="subtitle">
        Música, Informação e Muito Mais!
    </p>

    <!-- PLAYER ORIGINAL DO CASTER.FM -->
    <div class="player-box">

        <div
            data-type="newStreamPlayer"
            data-publicToken="e9c78308-9d30-4c94-8bd6-185e3fa14f1f"
            data-theme="light"
            data-color="e81e4d"
            data-channelId="a2cda98a-3830-4240-8a16-a474017567bd"
            data-rendered="false"
            class="cstrEmbed">

            <a href="https://www.caster.fm">Shoutcast Hosting</a>
            <a href="https://www.caster.fm">Stream Hosting</a>
            <a href="https://www.caster.fm">Radio Server Hosting</a>

        </div>

    </div>

    <div class="now-playing">
        📻 PC Rádio FM <span>• AO VIVO</span>
    </div>

    <p class="description">
        Aperte o PLAY e venha ouvir nossa programação!
    </p>

    <div class="line"></div>

    <div class="footer">
        Obrigado por ouvir a PC Rádio FM ❤️<br>
        Música, informação e companhia para você.
    </div>

</main>

<script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

</body>
</html>
