
  <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC Rádio FM - Música, Informação e Muito Mais!</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #4a1024 0%, #180611 35%, #050505 75%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
}

/* CARTÃO PRINCIPAL */
.radio-box {
    width: 100%;
    max-width: 700px;
    background: rgba(13, 13, 16, 0.97);
    border: 1px solid rgba(232, 30, 77, 0.55);
    border-radius: 30px;
    padding: 32px 25px 30px;
    text-align: center;
    box-shadow:
        0 25px 70px rgba(0,0,0,0.8),
        0 0 45px rgba(232,30,77,0.12);
}

/* LOGO */
.logo {
    width: 155px;
    height: 155px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #e81e4d;
    display: block;
    margin: 0 auto 20px;
    box-shadow:
        0 0 0 7px rgba(232,30,77,0.08),
        0 0 35px rgba(232,30,77,0.45);
}

/* AO VIVO */
.live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232,30,77,0.12);
    border: 1px solid rgba(232,30,77,0.5);
    color: #ff5579;
    font-size: 13px;
    font-weight: bold;
    padding: 8px 17px;
    border-radius: 30px;
    margin-bottom: 15px;
}

/* NOME */
h1 {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

h1 span {
    color: #e81e4d;
}

.subtitle {
    color: #aaa;
    font-size: 16px;
    margin-bottom: 25px;
}

/* ÁREA DO PLAYER */
.player-title {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.player-box {
    background: linear-gradient(145deg, #ffffff, #eeeeee);
    border-radius: 20px;
    padding: 20px 15px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.08);
}

.cstrEmbed {
    width: 100%;
}

/* TOCANDO AGORA */
.now-playing {
    margin-top: 24px;
    background: #17171b;
    border: 1px solid #29292e;
    border-radius: 16px;
    padding: 16px;
}

.now-title {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
}

.now-name {
    font-size: 18px;
    font-weight: bold;
}

.now-name span {
    color: #e81e4d;
}

/* MENSAGEM */
.description {
    margin-top: 20px;
    color: #999;
    font-size: 14px;
}

/* LINHA */
.line {
    width: 80px;
    height: 3px;
    background: #e81e4d;
    margin: 25px auto 18px;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(232,30,77,0.5);
}

/* RODAPÉ */
.footer {
    color: #666;
    font-size: 13px;
    line-height: 1.7;
}

.footer strong {
    color: #999;
}

/* CELULAR */
@media (max-width: 480px) {

    body {
        padding: 12px 8px;
    }

    .radio-box {
        padding: 25px 14px 24px;
        border-radius: 24px;
    }

    .logo {
        width: 125px;
        height: 125px;
    }

    h1 {
        font-size: 36px;
    }

    .subtitle {
        font-size: 14px;
    }

    .player-box {
        padding: 12px 8px;
    }
}
</style>
</head>

<body>

<main class="radio-box">

    <!-- LOGO DA RÁDIO -->
    <img
        src="f7c397f4-6ba6-4932-b2c7-2b6a61c99599.jpg"
        alt="PC Rádio FM"
        class="logo"
    >

    <!-- STATUS -->
    <div class="live">
        🔴 AO VIVO
    </div>

    <!-- NOME DA RÁDIO -->
    <h1>
        PC Rádio <span>FM</span>
    </h1>

    <p class="subtitle">
        Música, Informação e Muito Mais!
    </p>

    <!-- PLAYER -->
    <div class="player-title">
        🎧 Ouça agora
    </div>

    <div class="player-box">

        <!-- CASTER.FM - NÃO ALTERAR -->
        <div
            data-type="newStreamPlayer"
            data-publicToken="e9c78308-9d30-4c94-8bd6-185e3fa14f1f"
            data-theme="light"
