<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PC Rádio FM - Música, Informação e Muito Mais!</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #050505;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .radio-page {
        width: 100%;
        max-width: 480px;
        min-height: 700px;
        background:
            radial-gradient(circle at 50% 20%, #222 0%, #090909 45%, #000 100%);
        border: 2px solid #f5b900;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
            0 0 25px rgba(245,185,0,.25),
            0 0 60px rgba(245,185,0,.10);
        text-align: center;
        padding-bottom: 30px;
    }

    .top {
        padding: 28px 15px 10px;
    }

    .onair {
        display: inline-block;
        border: 2px solid #ffcc00;
        color: #ffcc00;
        padding: 7px 18px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 15px;
        letter-spacing: 2px;
        margin-bottom: 20px;
        box-shadow: 0 0 12px rgba(255,204,0,.25);
    }

    .logo-area {
        position: relative;
        margin: auto;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        border: 5px solid #f5b900;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(circle, #303030 0%, #111 55%, #050505 100%);
        box-shadow:
            inset 0 0 25px #000,
            0 0 20px rgba(245,185,0,.35);
    }

    .equalizer {
        display: flex;
        align-items: end;
        gap: 5px;
        height: 48px;
        margin-bottom: 5px;
    }

    .equalizer span {
        width: 9px;
        background: #ffb900;
        border-radius: 2px;
        box-shadow: 0 0 8px rgba(255,185,0,.5);
    }

    .equalizer span:nth-child(1) { height: 18px; }
    .equalizer span:nth-child(2) { height: 30px; }
    .equalizer span:nth-child(3) { height: 40px; }
    .equalizer span:nth-child(4) { height: 25px; }
    .equalizer span:nth-child(5) { height: 48px; }
    .equalizer span:nth-child(6) { height: 34px; }
    .equalizer span:nth-child(7) { height: 23px; }

    .pc {
        font-size: 82px;
        line-height: 70px;
        font-weight: 900;
        letter-spacing: -8px;
        color: white;
        text-shadow: 3px 3px 0 #777;
    }

    .radio-name {
        font-size: 34px;
        font-weight: 900;
        margin-top: 12px;
    }

    .radio-name span {
        color: #ffc400;
        font-style: italic;
    }

    .slogan {
        margin: 25px 25px 8px;
        font-size: 25px;
        line-height: 1.2;
        font-style: italic;
        font-weight: bold;
    }

    .sub {
        color: #ffc400;
        font-weight: bold;
        margin-top: 8px;
        font-size: 14px;
        letter-spacing: 1px;
    }

    .features {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 28px 20px;
    }

    .feature {
        border-top: 1px solid #ffc400;
        border-bottom: 1px solid #ffc400;
        padding: 12px 5px;
        font-size: 12px;
        font-weight: bold;
    }

    .feature .icon {
        display: block;
        font-size: 24px;
        margin-bottom: 5px;
    }

    .player-box {
        margin: 15px 20px;
        padding: 20px 15px;
        border-radius: 18px;
        background: #111;
        border: 1px solid #555;
    }

    .play-button {
        width: 105px;
        height: 105px;
        border-radius: 50%;
        border: 4px solid #ffc400;
        background: #050505;
        color: #ffc400;
        font-size: 43px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(255,196,0,.35);
        transition: .2s;
    }

    .play-button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(255,196,0,.6);
    }

    .status {
        margin-top: 14px;
        font-size: 14px;
        color: #ddd;
    }

    audio {
        width: 100%;
        margin-top: 15px;
        display: none;
    }

    .backup-button {
        margin-top: 15px;
        background: transparent;
        color: #ffc400;
        border: 1px solid #ffc400;
        border-radius: 20px;
        padding: 9px 18px;
        cursor: pointer;
        font-weight: bold;
    }

    .backup-button:hover {
        background: #ffc400;
        color: #000;
    }

    .footer {
        margin-top: 22px;
        font-size: 12px;
        color: #aaa;
    }

    .footer strong {
        color: #ffc400;
    }

    @media (max-width: 400px) {
        .logo-area {
            width: 220px;
            height: 220px;
        }

        .pc {
            font-size: 70px;
        }

        .radio-name {
            font-size: 29px;
        }

        .slogan {
            font-size: 21px;
        }
    }
</style>
</head>

<body>

<div class="radio-page">

    <div class="top">

        <div class="onair">🔴 NO AR</div>

        <div class="logo-area">

            <div class="equalizer">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="pc">PC</div>

            <div class="radio-name">
                RÁDIO <span>FM</span>
            </div>

        </div>

        <div class="slogan">
            Música, Informação<br>
            e Muito Mais!
        </div>

        <div class="sub">
            A SUA RÁDIO NA INTERNET
        </div>

    </div>

    <div class="features">

        <div class="feature">
            <span class="icon">🎵</span>
            MÚSICA<br>24 HORAS
        </div>

        <div class="feature">
            <span class="icon">🎙️</span>
            INFORMAÇÃO<br>DE VERDADE
        </div>

        <div class="feature">
            <span class="icon">😊</span>
            ENTRETENIMENTO<br>COM VOCÊ
        </div>

        <div class="feature">
            <span class="icon">📻</span>
            SUA RÁDIO<br>NA INTERNET
        </div>

    </div>

    <div class="player-box">

        <div style="color:#ffc400;font-size:18px;font-weight:bold;margin-bottom:12px;">
            APERTE O PLAY E VENHA COM A GENTE!
        </div>

        <button class="play-button" id="playButton" onclick="tocarRadio()">
            ▶️
        </button>

        <div class="status" id="status">
            Pronto para ouvir a PC Rádio FM
        </div>

        <audio id="radioPlayer" controls></audio>

        <button class="backup-button" onclick="proximaConexao()">
            🔄 Tentar outra conexão
        </button>

    </div>

    <div class="footer">
        <strong>PC RÁDIO FM</strong><br>
        Música, Informação e Muito Mais!
    </div>

</div>

<script>

    /*
    =====================================================
       CONEXÕES DA PC RÁDIO FM

       AQUI VAMOS COLOCAR OS ENDEREÇOS DIRETOS
       DO ÁUDIO DA SUA RÁDIO.
    =====================================================
    */

    const conexoes = [

        "ENDERECO_DIRETO_DO_AUDIO_1",

        "ENDERECO_DIRETO_DO_AUDIO_2",

        "ENDERECO_DIRETO_DO_AUDIO_3"

    ];

    let conexaoAtual = 0;

    const player = document.getElementById("radioPlayer");
    const botao = document.getElementById("playButton");
    const status = document.getElementById("status");


    function tocarRadio() {

        const endereco = conexoes[conexaoAtual];

        if (!endereco || endereco.startsWith("ENDERECO_")) {

            status.innerHTML =
                "⚠️ Falta configurar o endereço direto da transmissão.";

            return;
        }

        player.src = endereco;

        player.play()
            .then(() => {

                botao.innerHTML = "❚❚";

                status.innerHTML =
                    "🟢 PC Rádio FM está no ar!";

            })
            .catch(() => {

                status.innerHTML =
                    "⚠️ Essa conexão não respondeu. Tentando outra...";

                proximaConexao();

            });
    }


    function proximaConexao() {

        conexaoAtual++;

        if (conexaoAtual >= conexoes.length) {
            conexaoAtual = 0;
        }

        status.innerHTML =
            "🔄 Testando conexão " +
            (conexaoAtual + 1) +
            "...";

        tocarRadio();
    }


    player.addEventListener("pause", function() {

        if (!player.ended) {
            botao.innerHTML = "▶️";
        }

    });


    player.addEventListener("playing", function() {

        botao.innerHTML = "❚❚";

        status.innerHTML =
            "🟢 PC Rádio FM está no ar!";

    });


    player.addEventListener("error", function() {

        status.innerHTML =
            "⚠️ Conexão indisponível. Tentando outra...";

        setTimeout(proximaConexao, 800);

    });

</script>

</body>
</html>
